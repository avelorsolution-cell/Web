<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8CD7A"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="ar" cx="75%" cy="15%" r="70%">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="agrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#D4AF37" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="800" fill="#0d0d0d"/>
  <rect width="640" height="800" fill="url(#ar)"/>
  <rect width="640" height="800" fill="url(#agrid)"/>

  <!-- layered design frames representing web / brand / 3D work -->
  <g transform="translate(150,230)">
    <rect x="-110" y="-70" width="300" height="200" rx="8" fill="#151515" stroke="#D4AF37" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="-84" cy="-44" r="4" fill="#D4AF37"/>
    <circle cx="-70" cy="-44" r="4" fill="#333"/>
    <circle cx="-56" cy="-44" r="4" fill="#333"/>
    <rect x="-90" y="-16" width="120" height="8" rx="2" fill="url(#ag)"/>
    <rect x="-90" y="4" width="180" height="6" rx="2" fill="#3a3a3a"/>
    <rect x="-90" y="20" width="150" height="6" rx="2" fill="#3a3a3a"/>
    <rect x="-90" y="46" width="60" height="50" fill="#1c1c1c" stroke="#333"/>
    <rect x="-20" y="46" width="60" height="50" fill="#1c1c1c" stroke="#333"/>
  </g>

  <g transform="translate(410,430) rotate(-4)">
    <rect x="-95" y="-120" width="220" height="240" rx="8" fill="#151515" stroke="#E8CD7A" stroke-opacity="0.55" stroke-width="1.5"/>
    <polygon points="0,-70 55,-15 0,40 -55,-15" fill="none" stroke="url(#ag)" stroke-width="2"/>
    <circle r="6" fill="#D4AF37"/>
    <rect x="-60" y="60" width="120" height="8" rx="2" fill="#3a3a3a"/>
    <rect x="-40" y="78" width="80" height="6" rx="2" fill="#2a2a2a"/>
  </g>

  <g transform="translate(190,600)">
    <rect x="-90" y="-60" width="230" height="170" rx="8" fill="#151515" stroke="#D4AF37" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="0" y="10" text-anchor="middle" font-family="Poppins, sans-serif" font-size="34" font-weight="700" fill="url(#ag)">A</text>
    <rect x="-60" y="40" width="170" height="6" rx="2" fill="#3a3a3a"/>
    <rect x="-60" y="56" width="120" height="6" rx="2" fill="#2a2a2a"/>
  </g>

  <line x1="150" y1="300" x2="410" y2="360" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="260" y1="330" x2="190" y2="540" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="1"/>
</svg>